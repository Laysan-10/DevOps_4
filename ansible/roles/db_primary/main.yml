- name: Install PostgreSQL
  apt:
    name: postgresql
    state: present
    update_cache: yes

- name: Configure PostgreSQL for replication
  blockinfile:
    path: /etc/postgresql/15/main/postgresql.conf
    block: |
      listen_addresses = '*'
      wal_level = replica
      max_wal_senders = 3
      wal_keep_size = 64

- name: Allow replication in pg_hba.conf
  lineinfile:
    path: /etc/postgresql/15/main/pg_hba.conf
    line: "host replication replicator 192.168.1.76/32 md5"
    create: yes

- name: Create replication user
  become_user: postgres
  postgresql_user:
    name: replicator
    password: "debian"
    role_attr_flags: "REPLICATION"

- name: Restart PostgreSQL
  service:
    name: postgresql
    state: restarted
